name: Build Golden Hen APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract and verify Golden Hen v0.3.2
        id: source
        shell: bash
        run: |
          set -euo pipefail
          archive='GoldenHen_v0.3.2_GitHub_Source.zip'
          if [[ ! -f "$archive" ]]; then
            echo "ERROR: Required source ZIP $archive missing at repository root." >&2
            echo 'Older Golden Hen ZIPs are ignored deliberately.' >&2
            ls -lah
            exit 1
          fi
          echo "SHA-256: $(sha256sum "$archive")"
          dest="$RUNNER_TEMP/goldenhen-v032"
          mkdir -p "$dest"
          unzip -q "$archive" -d "$dest"
          test -f "$dest/settings.gradle.kts"
          test -f "$dest/app/build.gradle.kts"
          test -f "$dest/app/src/main/java/com/goldenhen/anime/CrashDiagnostics.kt"
          test -f "$dest/app/src/main/java/com/goldenhen/anime/AnimeSiteScreen.kt"
          test -f "$dest/app/src/main/res/mipmap-hdpi/ic_launcher.png"
          grep -Fq 'versionName = "0.3.2"' "$dest/app/build.gradle.kts"
          grep -Fq 'GoldenHenApplication' "$dest/app/src/main/AndroidManifest.xml"
          echo "dir=$dest" >> "$GITHUB_OUTPUT"
          echo 'Confirmed v0.3.2 source, crash diagnostics and rooster launcher icon.'

      - name: Build debug APK
        env:
          PROJECT_DIR: ${{ steps.source.outputs.dir }}
        run: gradle --no-daemon --project-dir "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload v0.3.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldenHen-v0.3.2-debug-apk
          path: ${{ steps.source.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
