
name: Build Golden Hen APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f settings.gradle.kts || -f settings.gradle ]]; then
            project_dir='.'
          else
            roots=()

            while IFS= read -r -d '' match; do
              roots+=("$(dirname "$match")")
            done < <(
              find . -mindepth 2 -maxdepth 5 -type f \
                \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
                -not -path './.git/*' -print0
            )

            if [[ ${#roots[@]} -ne 1 ]]; then
              echo "Expected exactly one Android Gradle project; found ${#roots[@]}." >&2
              echo 'Check the Android project files.' >&2

              find . -maxdepth 4 -type f \
                \( -name 'settings.gradle*' -o -name 'build.gradle*' \) -print

              exit 1
            fi

            project_dir="${roots[0]}"
          fi

          if [[ ! -f "$project_dir/app/build.gradle.kts" && ! -f "$project_dir/app/build.gradle" ]]; then
            echo "No Android app Gradle module in $project_dir/app" >&2
            exit 1
          fi

          echo "Found project at: $project_dir"
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.dir }}
        run: gradle --no-daemon --project-dir "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldenHen-v0.2-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
