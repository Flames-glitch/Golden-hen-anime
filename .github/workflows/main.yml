name: Build Golden Hen APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract and verify Golden Hen v0.3.1
        id: source
        shell: bash
        run: |
          set -euo pipefail
          archive="GoldenHen_v0.3.1_GitHub_Source.zip"
          if [[ ! -f "$archive" ]]; then
            echo "ERROR: Upload $archive to the repository root before building." >&2
            echo 'Intentionally refusing to build old v0.1/v0.2/v0.3 ZIP archives.' >&2
            ls -la
            exit 1
          fi
          project_dir="$RUNNER_TEMP/goldenhen-v031"
          mkdir -p "$project_dir"
          unzip -q "$archive" -d "$project_dir"
          test -f "$project_dir/settings.gradle.kts"
          test -f "$project_dir/app/build.gradle.kts"
          test -f "$project_dir/app/src/main/res/mipmap-hdpi/ic_launcher.png"
          test -f "$project_dir/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
          test -f "$project_dir/app/src/main/java/com/goldenhen/anime/AnimeSiteScreen.kt"
          test -f "$project_dir/app/src/main/java/com/goldenhen/anime/EpisodeGuide.kt"
          grep -Fq 'versionName = "0.3.1"' "$project_dir/app/build.gradle.kts"
          grep -Fq '@mipmap/ic_launcher' "$project_dir/app/src/main/AndroidManifest.xml"
          echo 'Verified v0.3.1 source, launcher icon, and episode guide.'
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        env:
          PROJECT_DIR: ${{ steps.source.outputs.dir }}
        run: gradle --no-daemon --project-dir "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload v0.3.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldenHen-v0.3.1-debug-apk
          path: ${{ steps.source.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
