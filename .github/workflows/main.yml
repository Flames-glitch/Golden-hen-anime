
name: Build Golden Hen APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find or extract Golden Hen project
        id: source
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f settings.gradle.kts || -f settings.gradle ]]; then
            project_dir="$GITHUB_WORKSPACE"
          else
            project_dir=''

            for archive in \
              GoldenHen_v0.3_GitHub_Source.zip \
              Golden_Hen_V2_Android_GitHub_READY_20261024.zip \
              GoldenHen_V2_GitHub_Root_Fixed.zip \
              GoldenHen_Android_Repo_v0.2.zip; do
              if [[ -f "$archive" ]]; then
                echo "Found source ZIP: $archive"
                target="$RUNNER_TEMP/goldenhen-extracted"
                mkdir -p "$target"
                unzip -q "$archive" -d "$target"

                mapfile -d '' -t settings_files < <(
                  find "$target" -maxdepth 8 -type f \
                    \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print0
                )

                if [[ ${#settings_files[@]} -ne 1 ]]; then
                  echo "Expected exactly one Gradle project in ZIP; found ${#settings_files[@]}" >&2
                  exit 1
                fi

                project_dir="$(dirname "${settings_files[0]}")"
                break
              fi
            done

            if [[ -z "$project_dir" ]]; then
              echo 'No extracted project or supported Golden Hen ZIP found.' >&2
              find . -maxdepth 2 -type f -print
              exit 1
            fi
          fi

          if [[ ! -f "$project_dir/app/build.gradle.kts" && ! -f "$project_dir/app/build.gradle" ]]; then
            echo "Missing Android app module in $project_dir/app" >&2
            exit 1
          fi

          echo "Building project at: $project_dir"
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        env:
          PROJECT_DIR: ${{ steps.source.outputs.dir }}
        run: gradle --no-daemon --project-dir "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldenHen-v0.3-debug-apk
          path: ${{ steps.source.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
