name: Build Golden Hen APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Assemble and verify Golden Hen v0.3.5
        id: source
        shell: bash
        run: |
          set -euo pipefail
          archive='GoldenHen_v0.3.2_GitHub_Source.zip'
          patch64='patches/GoldenHen-v0.3.4-from-v0.3.2.patch.gz.b64'
          test -f "$archive" || { echo "Missing base source: $archive" >&2; exit 1; }
          test -f "$patch64" || { echo "Missing v0.3.4 source patch: $patch64" >&2; exit 1; }

          dest="$RUNNER_TEMP/goldenhen-v034"
          mkdir -p "$dest"
          unzip -q "$archive" -d "$dest"
          base64 -d "$patch64" | gzip -dc > "$RUNNER_TEMP/GoldenHen-v034.patch"
          (
            cd "$dest"
            patch --batch --fuzz=0 -p1 < "$RUNNER_TEMP/GoldenHen-v034.patch"
            echo '61e8e24065377f9346e248f7d6dee774e16b3660e0533d32784a7bb3e6e3177f  app/build.gradle.kts' | sha256sum -c -
            echo 'b1a67c30af01fbb28c8cdfead3a7c6ba4f49b7c81c02d4bb8ed4e19e7b6c9cb7  app/src/main/java/com/goldenhen/anime/AppDiagnostics.kt' | sha256sum -c -
            echo 'eb5a92e7120472a648f7f6fc1f06b579f13d520768439b75e8a0c8e3ba84ba46  app/src/main/java/com/goldenhen/anime/DiagnosticsScreen.kt' | sha256sum -c -
            echo '0c5ca470f32145afcbc1ed148dc874cd355cd290a7fdd47ae69f0bec28aeea59  app/src/main/java/com/goldenhen/anime/MainActivity.kt' | sha256sum -c -
            test -f app/src/main/res/mipmap-hdpi/ic_launcher.png
            grep -Fq 'versionName = "0.3.4"' app/build.gradle.kts
          )
          patch035='patches/GoldenHen-v0.3.5-from-v0.3.4.patch.gz.b64'
          test -f "$patch035" || { echo "Missing v0.3.5 source patch." >&2; exit 1; }
          base64 -d "$patch035" | gzip -dc > "$RUNNER_TEMP/GoldenHen-v035.patch"
          (
            cd "$dest"
            patch --batch --fuzz=0 -p1 < "$RUNNER_TEMP/GoldenHen-v035.patch"
            # Compile fix: qualify Android WebSettings rather than relying on an import.
            sed -i 's/WebSettings\.MIXED_CONTENT_NEVER_ALLOW/android.webkit.WebSettings.MIXED_CONTENT_NEVER_ALLOW/' app/src/main/java/com/goldenhen/anime/AnimepaheFeed.kt
            echo 'a3e2c955944be84d2c9e02f37596cf92fdbae18911adbc1f8cb5ff431ee1bee8  app/build.gradle.kts' | sha256sum -c -
            echo 'defa333d1c958a4a62121ab47e8cd5f68fbf8577fba5f9d250a2905b2101fa99  app/src/main/java/com/goldenhen/anime/AnimepaheFeed.kt' | sha256sum -c -
            echo '01e86ab3198716271fe4c398be7f16e566873f5a752fb0dfc8972328182571e6  app/src/main/java/com/goldenhen/anime/MainActivity.kt' | sha256sum -c -
            echo 'c4e46f0fbc2e3c3655bef3e9b3aa23f308e2a905c4f07e696252d9f6c8351811  app/src/main/java/com/goldenhen/anime/AnimeSiteScreen.kt' | sha256sum -c -
            test -f app/src/main/res/mipmap-hdpi/ic_launcher.png
            test -f app/src/main/java/com/goldenhen/anime/AppDiagnostics.kt
            grep -Fq 'versionName = "0.3.5"' app/build.gradle.kts
          )
          echo "dir=$dest" >> "$GITHUB_OUTPUT"
          echo 'Confirmed v0.3.5 Animepahe poster grid, diagnostics and retained launcher icon.'

      - name: Build debug APK
        env:
          PROJECT_DIR: ${{ steps.source.outputs.dir }}
        run: gradle --no-daemon --project-dir "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload v0.3.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldenHen-v0.3.5-debug-apk
          path: ${{ steps.source.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
